<!-- frontend/edit-recipe.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Recipe - Flavoriz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="form.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="assistant.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <nav class="navbar">
    <a href="index.html" class="logo">Flavoriz</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="recipe.html">Add Recipe</a>
      <a href="profile.html">Profile</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <main id="main" class="form-page">
    <div class="form-card">
      <h2>Edit Recipe</h2>
      <p class="form-subtext">Update your recipe details</p>

      <form id="editForm">
        <label for="title">Recipe Title</label>
        <input type="text" id="title" required>

        <div class="form-row">
          <div>
            <label for="cuisine">Cuisine</label>
            <input type="text" id="cuisine" required>
          </div>
          <div>
            <label for="servings">Servings</label>
            <input type="number" id="servings" required>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="prepTime">Prep Time</label>
            <input type="text" id="prepTime" required>
          </div>
          <div>
            <label for="cookTime">Cook Time</label>
            <input type="text" id="cookTime" required>
          </div>
        </div>

        <label for="image">Recipe Image</label>
        <div class="image-upload-box" id="imageUploadBox">
          <input type="file" id="image" accept="image/*" hidden>
          <div id="uploadPlaceholder">
            <span class="upload-icon">📷</span>
            <p>Click to change photo</p>
          </div>
          <img id="imagePreview" style="display:none;" alt="preview">
        </div>

        <label for="ingredients">Ingredients (one per line)</label>
        <textarea id="ingredients" rows="5" required></textarea>

        <label for="steps">Cooking Steps (one per line)</label>
        <textarea id="steps" rows="6" required></textarea>

        <button type="submit" class="btn-primary">Save Changes</button>
      </form>
      <p id="errorMsg" class="error-text"></p>
    </div>
  </main>

  <script src="editRecipe.js"></script>
  <script src="assistant.js"></script>
</body>
</html>
