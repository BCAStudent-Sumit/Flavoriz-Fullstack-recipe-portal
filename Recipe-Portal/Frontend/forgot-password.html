<!-- frontend/forgot-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Flavoriz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-form-side" style="flex: 1; width: 100%;">
      <div class="auth-box">
        <h2>Forgot Password?</h2>
        <p class="auth-subtext">Enter your email and we'll send you a reset link</p>

        <form id="forgotForm">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">

          <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>

        <p class="auth-switch">Remembered it? <a href="login.html">Log in</a></p>
        <p id="statusMsg" class="error-text"></p>
      </div>
    </div>
  </div>

  <script src="forgotPassword.js"></script>
</body>
</html>
