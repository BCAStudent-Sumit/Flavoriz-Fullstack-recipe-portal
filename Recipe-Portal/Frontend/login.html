<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Flavoriz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-image">
      <svg class="line-art-bg" viewBox="0 0 200 200" fill="none" stroke="white" stroke-width="2">
        <circle cx="100" cy="100" r="80"/>
        <path d="M60 100 Q100 60 140 100 Q100 140 60 100 Z"/>
        <line x1="30" y1="60" x2="30" y2="140"/>
        <line x1="170" y1="60" x2="170" y2="140"/>
      </svg>

      <svg class="auth-wave" viewBox="0 0 160 800" preserveAspectRatio="none">
        <path d="M0,0 L60,0 C90,80 30,160 70,240 C110,320 20,400 65,480 C100,560 30,640 60,720 C80,760 40,780 60,800 L0,800 Z"/>
      </svg>

      <div class="image-stack">
        <img class="stack-photo p1" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400" alt="taco">
        <img class="stack-photo p2" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300" alt="salad">
        <img class="stack-photo p3" src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=300" alt="pasta">
      </div>

      <div class="spark s1"><svg viewBox="0 0 24 24" fill="white"><path d="M13 2L3 14h7l-2 8 10-12h-7l2-8z"/></svg></div>
      <div class="spark s2"><svg viewBox="0 0 24 24" fill="white"><path d="M13 2L3 14h7l-2 8 10-12h-7l2-8z"/></svg></div>
      <div class="spark s3"><svg viewBox="0 0 24 24" fill="white"><path d="M13 2L3 14h7l-2 8 10-12h-7l2-8z"/></svg></div>
      <div class="spark s4"><svg viewBox="0 0 24 24" fill="white"><path d="M13 2L3 14h7l-2 8 10-12h-7l2-8z"/></svg></div>
      <div class="spark s5"><svg viewBox="0 0 24 24" fill="white"><path d="M13 2L3 14h7l-2 8 10-12h-7l2-8z"/></svg></div>
    </div>

    <div class="auth-form-side">
      <img class="corner-decor top-right" src="https://images.unsplash.com/photo-1618164436241-4473940d1f5c?w=300" alt="basil">
      <img class="corner-decor bottom-right" src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=300" alt="herbs">

      <div class="auth-box">
        <h2>Welcome Back!</h2>
        <p class="auth-subtext">Log in to continue exploring recipes</p>

        <form id="loginForm">
          <label for="email">Email or Username</label>
          <input type="text" id="email" placeholder="you@example.com or username" required autocomplete="username">

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">

          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          
          <button type="submit" class="btn-primary">Login</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
        <p id="errorMsg" class="error-text"></p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
