<!-- frontend/reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Flavoriz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-form-side" style="flex: 1; width: 100%;">
      <div class="auth-box">
        <h2>Set New Password</h2>
        <p class="auth-subtext">Choose a new password for your account</p>

        <form id="resetForm">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">

          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">

          <button type="submit" class="btn-primary">Update Password</button>
        </form>

        <p class="auth-switch"><a href="login.html">Back to log in</a></p>
        <p id="statusMsg" class="error-text"></p>
      </div>
    </div>
  </div>

  <script src="resetPassword.js"></script>
</body>
</html>
